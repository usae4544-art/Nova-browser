name: Bootstrap Sealed Debug Keystore

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and seal debug keystore
        env:
          SEAL_KEY_HEX: ${{ secrets.TEMP_SEAL_KEY }}
        run: |
          if [ -z "$SEAL_KEY_HEX" ]; then
            echo "TEMP_SEAL_KEY missing"
            exit 1
          fi
          keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore /tmp/debug.keystore -storepass android | grep -E "Alias name:|SHA256:"
          python3 -c '
          import hashlib, hmac, os, secrets
          key = bytes.fromhex(os.environ["SEAL_KEY_HEX"].strip())
          with open("/tmp/debug.keystore", "rb") as f:
              pt = f.read()
          nonce = secrets.token_bytes(16)
          ks = bytearray()
          i = 0
          while len(ks) < len(pt):
              ks.extend(hmac.new(key, b"CTR" + nonce + i.to_bytes(4, "big"), hashlib.sha256).digest())
              i += 1
          ct = bytes(a ^ b for a, b in zip(pt, ks[:len(pt)]))
          mac = hmac.new(key, b"MAC" + nonce + ct, hashlib.sha256).digest()
          with open("sealed-keystore.bin", "wb") as f:
              f.write(nonce + mac + ct)
          '
          rm -f /tmp/debug.keystore

      - name: Upload sealed keystore
        uses: actions/upload-artifact@v4
        with:
          name: sealed-keystore
          path: sealed-keystore.bin
          retention-days: 1
