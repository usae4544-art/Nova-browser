name: Build and Release Nova Browser APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Restore persistent debug keystore
        env:
          NOVA_DEBUG_KEYSTORE_BASE64: ${{ secrets.NOVA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NOVA_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring persistent debug.keystore from NOVA_DEBUG_KEYSTORE_BASE64 secret..."
            echo "$NOVA_DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            keytool -list -v -keystore debug.keystore -storepass android | grep -E "Alias name:|SHA256:"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Error: NOVA_DEBUG_KEYSTORE_BASE64 secret is missing for release build! Aborting to prevent mismatched APK signing certificates."
            exit 1
          else
            echo "Generating ephemeral debug.keystore for non-release CI check..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create local.properties and dummy .env if missing
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run JVM Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
          grep -h "<testsuite " app/build/test-results/testDebugUnitTest/*.xml || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" ./app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ./app-debug.apk
          retention-days: 14

      - name: Publish or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.3")
          fi

          NOTES_FILE="RELEASE_NOTES_${TAG_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" release_notes.md
          else
            echo "## Nova Browser ${TAG_NAME}" > release_notes.md
            echo "" >> release_notes.md
            git log -n 8 --pretty=format:"- %s" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [ "$TAG_NAME" = "v1.0.3" ]; then
            RELEASE_TITLE="Nova Browser v1.0.3 (Community Reviews, Accounts, Sakuga Typewriter VFX & All-File Downloads)"
          elif [ "$TAG_NAME" = "v1.0.4" ]; then
            RELEASE_TITLE="Nova Browser v1.0.4 (Google Web Login, Soft Light Mode & Pull-Down Menu)"
          else
            RELEASE_TITLE="Nova Browser ${TAG_NAME}"
          fi

          SHA256=$(sha256sum ./app-debug.apk | awk '{print $1}')
          echo "" >> release_notes.md
          echo "**APK SHA-256:**" >> release_notes.md
          echo "\`$SHA256\`" >> release_notes.md

          # Delete existing release for this tag if it exists
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true

          # Create release and publish asset
          gh release create "$TAG_NAME" ./app-debug.apk \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --latest
