name: Build and Release Nova Browser APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Create debug keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create local.properties and dummy .env if missing
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest --continue || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" ./app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ./app-debug.apk
          retention-days: 14

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.3"
          RELEASE_TITLE="Nova Browser v1.0.3 (Community Reviews, Accounts, Sakuga Typewriter VFX & All-File Downloads)"

          cat << 'EOF' > release_notes.md
## Nova Browser v1.0.3

### What's New

• **🌟 Community Reviews & Star Ratings (Liquid Glass UI)**: Interactive 5-star rating with bouncy spring animations and Sakuga micro-sparks. View all verified community reviews, rating distribution breakdown, review comments, and submit or edit your own review.
• **✍️ Sakuga Typewriter / Writing VFX**: Typewriter key strikes, upward ink particle accents, and shimmering glints while typing in search or comments. Expanding liquid meniscus wave when tapping the bottom dock capsule.
• **👤 Persistent User Account System**: Sign in or create a custom profile with display name, bio, and glowing avatar accent colors. Account session persists seamlessly across the entire browser.
• **📥 All-File & Blob Download Support**: Integrated DOM JavaScript bridge (`__novaBlobBridge`) converting in-memory `blob:` URLs into downloads, universal format detection (APKs, ZIP, RAR, 7Z, TAR, GZ, ISO, PDF, DOCX, MP4, MP3, etc.), and MediaStore public storage sync. Added Archives filter in Downloads.
• **🚀 In-App GitHub Auto-Updater**: Bumps version to v1.0.3 with instant notification dialog for all users.
EOF

          SHA256=$(sha256sum ./app-debug.apk | awk '{print $1}')
          echo "" >> release_notes.md
          echo "**APK SHA-256:**" >> release_notes.md
          echo "\`$SHA256\`" >> release_notes.md

          # Delete existing release for this tag if it exists
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true

          # Create release and publish asset
          gh release create "$TAG_NAME" ./app-debug.apk \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --latest
